<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Share your family's Chắn rules</title>
  <meta name="description" content="Tell us how your family plays Chắn, Tổ Tôm, or a related card game. No GitHub account required.">
  <link rel="stylesheet" href="/style.css">
  <script src="/form.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="top"><a class="brand" href="https://michaelnguyen.net/baichan.html">bài chắn</a><label class="language"><span id="language-label">Language</span><select id="language"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label></header>
    <div class="hero"><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="intro"></p></div>
    <aside class="notice" id="privacy"></aside>
    <form id="survey" novalidate><div class="progress"><span id="step-count"></span><span id="saved"></span></div><div class="progress-track"><div id="progress-fill"></div></div><section class="panel" id="questions"></section><p class="error" id="error" role="alert" hidden></p><div class="actions"><button type="button" id="back" class="secondary"></button><button type="button" id="next" class="primary"></button></div><label class="trap" aria-hidden="true">Website <input id="website" name="website" tabindex="-1" autocomplete="off"></label></form>
    <section class="success" id="success" hidden><div class="check">✓</div><h2 id="success-title"></h2><p id="success-copy"></p><p id="reference"></p><button type="button" id="new-response" class="primary"></button></section>
    <footer><a id="about-link" href="https://michaelnguyen.net/baichan.html"></a><a id="game-link" href="https://bai-chan-play.white-violet-3211.workers.dev/"></a></footer>
  </main>
</body>
</html>
